<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- shadow -->
  <ellipse cx="86" cy="148" rx="52" ry="7" fill="rgba(0,0,0,0.3)"/>
  <!-- bun top (dome) -->
  <ellipse cx="86" cy="56" rx="50" ry="28" fill="#ca6f1e"/>
  <!-- sesame seeds -->
  <ellipse cx="72" cy="46" rx="5" ry="3" fill="#e59866" opacity="0.7" transform="rotate(-20,72,46)"/>
  <ellipse cx="90" cy="40" rx="5" ry="3" fill="#e59866" opacity="0.7" transform="rotate(10,90,40)"/>
  <ellipse cx="104" cy="48" rx="5" ry="3" fill="#e59866" opacity="0.7" transform="rotate(25,104,48)"/>
  <!-- bun top bottom slice -->
  <ellipse cx="86" cy="72" rx="50" ry="10" fill="#935116"/>
  <!-- lettuce -->
  <path d="M34,76 Q50,68 62,74 Q70,68 78,74 Q86,68 94,74 Q102,68 110,74 Q122,68 138,76" fill="none" stroke="rgba(46,160,67,0.9)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cheese -->
  <rect x="36" y="82" width="100" height="10" fill="rgba(240,190,30,0.85)" rx="1"/>
  <!-- patty -->
  <rect x="36" y="94" width="100" height="18" rx="4" fill="rgba(80,40,10,0.9)"/>
  <line x1="40" y1="100" x2="130" y2="100" stroke="rgba(120,60,20,0.5)" stroke-width="1.5"/>
  <!-- tomato -->
  <rect x="38" y="114" width="100" height="8" rx="2" fill="rgba(200,50,40,0.8)"/>
  <!-- bun bottom -->
  <ellipse cx="86" cy="126" rx="50" ry="10" fill="#e59866" opacity="0.9"/>
  <ellipse cx="86" cy="136" rx="50" ry="10" fill="#ca6f1e"/>
  <ellipse cx="86" cy="136" rx="50" ry="10" fill="#935116" opacity="0.4"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#ca6f1e" stroke-width="1" opacity="0.3"/>
</svg>