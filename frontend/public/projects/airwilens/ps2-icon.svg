<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- shadow -->
  <ellipse cx="80" cy="140" rx="34" ry="6" fill="rgba(0,0,0,0.3)"/>
  <!-- phone depth (right side) -->
  <path d="M104,46 L116,38 L116,128 L104,136 Z" fill="#0d3d60"/>
  <!-- phone top depth -->
  <path d="M56,46 L68,38 L116,38 L104,46 Z" fill="#1a6090"/>
  <!-- phone body (front) -->
  <rect x="56" y="46" width="48" height="90" rx="6" fill="#2980b9"/>
  <!-- screen -->
  <rect x="62" y="56" width="36" height="64" rx="3" fill="#0d3d60"/>
  <!-- camera lens on screen -->
  <circle cx="80" cy="80" r="16" fill="rgba(10,30,60,0.9)" stroke="#5dade2" stroke-width="2"/>
  <circle cx="80" cy="80" r="10" fill="#081828" stroke="#5dade2" stroke-width="1.2" opacity="0.8"/>
  <circle cx="80" cy="80" r="5" fill="#5dade2" opacity="0.7"/>
  <circle cx="76" cy="76" r="2" fill="white" opacity="0.4"/>
  <!-- WiFi arcs shooting from phone -->
  <path d="M120,60 Q138,80 120,100" fill="none" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M126,52 Q150,80 126,108" fill="none" stroke="#5dade2" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M132,44 Q162,80 132,116" fill="none" stroke="#5dade2" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- record dot -->
  <circle cx="80" cy="112" r="3" fill="rgba(255,80,80,0.9)"/>
  <!-- home bar -->
  <rect x="68" y="125" width="24" height="3" rx="1.5" fill="#5dade2" opacity="0.4"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#2980b9" stroke-width="1" opacity="0.3"/>
</svg>