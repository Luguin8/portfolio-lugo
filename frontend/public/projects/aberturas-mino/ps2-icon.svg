<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- window shadow -->
  <ellipse cx="86" cy="148" rx="50" ry="7" fill="rgba(0,0,0,0.3)"/>
  <!-- right depth -->
  <path d="M120,30 L138,18 L138,148 L120,136" fill="#502c10"/>
  <!-- top depth -->
  <path d="M36,30 L54,18 L138,18 L120,30" fill="#78421e"/>
  <!-- outer frame (front) -->
  <rect x="36" y="30" width="84" height="106" rx="2" fill="#a0522d"/>
  <!-- window glass panes (2x2) -->
  <rect x="44" y="38" width="34" height="42" rx="1" fill="rgba(160,220,255,0.25)" stroke="#cd853f" stroke-width="1.5"/>
  <rect x="82" y="38" width="30" height="42" rx="1" fill="rgba(160,220,255,0.25)" stroke="#cd853f" stroke-width="1.5"/>
  <rect x="44" y="84" width="34" height="44" rx="1" fill="rgba(160,220,255,0.2)" stroke="#cd853f" stroke-width="1.5"/>
  <rect x="82" y="84" width="30" height="44" rx="1" fill="rgba(160,220,255,0.2)" stroke="#cd853f" stroke-width="1.5"/>
  <!-- glass shine -->
  <line x1="46" y1="40" x2="54" y2="52" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="40" x2="90" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- window handle -->
  <rect x="75" y="80" width="6" height="12" rx="3" fill="#cd853f"/>
  <!-- wood grain lines -->
  <line x1="36" y1="42" x2="36" y2="128" stroke="#cd853f" stroke-width="0.8" opacity="0.35"/>
  <line x1="112" y1="42" x2="112" y2="128" stroke="#cd853f" stroke-width="0.8" opacity="0.35"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#a0522d" stroke-width="1" opacity="0.3"/>
</svg>