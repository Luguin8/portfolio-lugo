<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <g transform="translate(86,86) scale(1.15) translate(-86,-86)">
    <ellipse cx="86" cy="148" rx="52" ry="8" fill="rgba(0,0,0,0.28)"/>
    <!-- box right -->
    <polygon points="120,58 142,44 142,130 120,144" fill="#2e3f47"/>
    <!-- box top/lid -->
    <polygon points="32,58 54,44 142,44 120,58" fill="#455a64"/>
    <!-- lid flap -->
    <path d="M32,52 Q86,38 140,52" fill="none" stroke="#90a4ae" stroke-width="2" opacity="0.5"/>
    <!-- box body -->
    <rect x="32" y="58" width="88" height="86" rx="2" fill="#607d8b"/>
    <!-- inner shadow -->
    <rect x="32" y="58" width="88" height="16" fill="rgba(0,0,0,0.2)"/>
    <!-- tape strip -->
    <rect x="74" y="44" width="24" height="100" fill="#2e3f47" opacity="0.35"/>
    <line x1="74" y1="44" x2="74" y2="144" stroke="#455a64" stroke-width="1" opacity="0.4"/>
    <line x1="98" y1="44" x2="98" y2="144" stroke="#455a64" stroke-width="1" opacity="0.4"/>
    <!-- 3 small greyed icons inside box -->
    <!-- taco (Comida Callejera) -->
    <path d="M46,100 Q56,88 66,100 Q60,116 56,118 Q52,116 46,100 Z" fill="#90a4ae" opacity="0.45"/>
    <!-- burger (Burger House) -->
    <ellipse cx="86" cy="90" rx="14" ry="5" fill="#90a4ae" opacity="0.4"/>
    <rect x="72" y="93" width="28" height="5" rx="1" fill="#455a64" opacity="0.4"/>
    <ellipse cx="86" cy="100" rx="14" ry="5" fill="#90a4ae" opacity="0.4"/>
    <!-- heart (AppCC) -->
    <path d="M114,88 C114,88 104,96 104,102 C104,106 107,108 110,107 C112,106 114,104 114,104 C114,104 116,106 118,107 C121,108 124,106 124,102 C124,96 114,88 114,88 Z" fill="#90a4ae" opacity="0.42"/>
    <!-- ARCH label -->
    <text x="86" y="136" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#90a4ae" letter-spacing="3" opacity="0.7">ARCH</text>
  </g>
