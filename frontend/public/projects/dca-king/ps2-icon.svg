<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- crown shadow -->
  <ellipse cx="87" cy="138" rx="52" ry="8" fill="rgba(0,0,0,0.35)"/>
  <!-- right extrusion -->
  <polygon points="130,72 144,62 144,120 130,130" fill="#7d6608"/>
  <polygon points="110,96 124,86 144,62 130,72" fill="#b7950b"/>
  <polygon points="86,56 100,46 124,86 110,96" fill="#b7950b" opacity="0.8"/>
  <!-- crown front -->
  <polygon points="42,130 42,72 62,96 86,56 110,96 130,72 130,130" fill="#f1c40f"/>
  <!-- crown highlight edge -->
  <polyline points="42,72 62,96 86,56 110,96 130,72" fill="none" stroke="#f4d03f" stroke-width="2" stroke-linejoin="round"/>
  <!-- jewels in crown points -->
  <circle cx="86" cy="60" r="6" fill="rgba(255,80,80,0.9)" stroke="#f4d03f" stroke-width="1"/>
  <circle cx="62" cy="98" r="5" fill="rgba(80,160,255,0.9)" stroke="#f4d03f" stroke-width="1"/>
  <circle cx="110" cy="98" r="5" fill="rgba(80,255,120,0.9)" stroke="#f4d03f" stroke-width="1"/>
  <!-- BTC symbol inside crown body -->
  <text x="84" y="120" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#7d6608" opacity="0.7">&#x20BF;</text>
  <!-- base line -->
  <line x1="42" y1="130" x2="130" y2="130" stroke="#f4d03f" stroke-width="2" opacity="0.5"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#f1c40f" stroke-width="1" opacity="0.3"/>
</svg>