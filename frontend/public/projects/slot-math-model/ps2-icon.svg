<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- slot machine cabinet -->
  <!-- right side depth -->
  <polygon points="118,36 140,24 140,136 118,148" fill="#4a235a"/>
  <!-- top depth -->
  <polygon points="32,36 54,24 140,24 118,36" fill="#6c3483"/>
  <!-- front face -->
  <rect x="32" y="36" width="86" height="112" rx="3" fill="#8e44ad"/>
  <!-- display window -->
  <rect x="42" y="52" width="66" height="40" rx="2" fill="rgba(0,0,0,0.7)" stroke="#bb8fce" stroke-width="1.5"/>
  <!-- reel dividers -->
  <line x1="64" y1="52" x2="64" y2="92" stroke="#6c3483" stroke-width="1.5"/>
  <line x1="86" y1="52" x2="86" y2="92" stroke="#6c3483" stroke-width="1.5"/>
  <!-- reel numbers -->
  <text x="53" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#bb8fce">7</text>
  <text x="75" y="78" text-anchor="middle" font-family="monospace" font-size="19" font-weight="bold" fill="rgba(255,220,60,0.9)">*</text>
  <text x="97" y="78" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#bb8fce">7</text>
  <!-- lever (handle) on right -->
  <circle cx="126" cy="62" r="6" fill="#bb8fce" stroke="#4a235a" stroke-width="1.5"/>
  <rect x="124" y="62" width="4" height="32" rx="2" fill="#bb8fce"/>
  <!-- button row -->
  <circle cx="52" cy="108" r="7" fill="#6c3483" stroke="#bb8fce" stroke-width="1.5"/>
  <circle cx="75" cy="108" r="7" fill="#6c3483" stroke="#bb8fce" stroke-width="1.5"/>
  <circle cx="98" cy="108" r="7" fill="#6c3483" stroke="#bb8fce" stroke-width="1.5"/>
  <!-- RTP label -->
  <text x="75" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#bb8fce" letter-spacing="2" opacity="0.7">RTP 96.17%</text>
  <!-- coin slot -->
  <rect x="60" y="142" width="30" height="5" rx="2" fill="#4a235a"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#8e44ad" stroke-width="1" opacity="0.3"/>
</svg>