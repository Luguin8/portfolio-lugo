  <line x1="46" y1="67" x2="78" y2="64" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="46" y1="76" x2="78" y2="73" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="46" y1="85" x2="78" y2="82" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="46" y1="94" x2="78" y2="91" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="46" y1="103" x2="65" y2="101" stroke="#c39bd3" stroke-width="1.3" opacity="0.45"/>
  <!-- text lines right -->
  <line x1="94" y1="67" x2="126" y2="64" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="94" y1="76" x2="126" y2="73" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="94" y1="85" x2="126" y2="82" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="94" y1="94" x2="126" y2="91" stroke="#c39bd3" stroke-width="1.3" opacity="0.55"/>
  <line x1="94" y1="103" x2="114" y2="101" stroke="#c39bd3" stroke-width="1.3" opacity="0.45"/>
  <!-- TTS sound waves right of book -->
  <path d="M138,82 Q145,90 138,98" fill="none" stroke="rgba(200,140,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <path d="M142,76 Q153,90 142,104" fill="none" stroke="rgba(200,140,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M146,70 Q161,90 146,110" fill="none" stroke="rgba(200,140,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.3"/>
