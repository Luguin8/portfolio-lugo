  <path d="M82,42 L38,52 L38,128 L82,122 Z" fill="#4a235a" opacity="0.7"/>
  <!-- right page back face -->
  <path d="M90,42 L134,52 L134,128 L90,122 Z" fill="#4a235a" opacity="0.7"/>
  <!-- left page front -->
