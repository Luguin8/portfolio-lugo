<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- bolt shadow -->
  <polygon points="96,36 70,100 90,100 74,152 116,80 94,80 112,36" fill="rgba(0,0,0,0.35)" transform="translate(6,6)"/>
  <!-- extruded right face -->
  <polygon points="102,36 76,100 96,100 80,152 122,80 100,80 118,36" fill="#7d3a08"/>
  <!-- bolt back/top -->
  <polygon points="88,28 102,36 76,100 62,92 Z" fill="#b85c10" opacity="0.7"/>
  <polygon points="66,144 80,152 96,100 82,92 Z" fill="#b85c10" opacity="0.7"/>
  <!-- bolt front face -->
  <polygon points="88,28 62,92 82,92 66,144 108,72 86,72 104,28" fill="#e67e22"/>
  <!-- highlight -->
  <polygon points="88,28 62,92 82,92 66,144 108,72 86,72 104,28" fill="rgba(255,255,255,0.08)"/>
  <line x1="88" y1="28" x2="62" y2="92" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
  <!-- GTM badge -->
  <rect x="62" y="58" width="26" height="16" rx="2" fill="rgba(0,0,0,0.4)"/>
  <text x="75" y="70" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#f39c12" letter-spacing="1">GTM</text>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#e67e22" stroke-width="1" opacity="0.3"/>
</svg>