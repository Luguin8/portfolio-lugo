<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- ball shadow -->
  <ellipse cx="86" cy="144" rx="44" ry="9" fill="rgba(0,0,0,0.3)"/>
  <!-- main sphere with gradient via radial stops workaround -->
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="60%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#0f5028"/>
    </radialGradient>
  </defs>
  <circle cx="86" cy="88" r="52" fill="url(#ball)"/>
  <!-- soccer ball patches (pentagons simplified as arcs/lines) -->
  <!-- central pentagon -->
  <polygon points="86,64 102,78 96,98 76,98 70,78" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
  <polygon points="86,64 102,78 96,98 76,98 70,78" fill="rgba(0,0,0,0.22)"/>
  <!-- surrounding patch lines -->
  <line x1="86" y1="64" x2="86" y2="40" stroke="rgba(0,0,0,0.3)" stroke-width="1.8"/>
  <line x1="102" y1="78" x2="124" y2="68" stroke="rgba(0,0,0,0.3)" stroke-width="1.8"/>
  <line x1="96" y1="98" x2="116" y2="112" stroke="rgba(0,0,0,0.3)" stroke-width="1.8"/>
  <line x1="76" y1="98" x2="56" y2="112" stroke="rgba(0,0,0,0.3)" stroke-width="1.8"/>
  <line x1="70" y1="78" x2="48" y2="68" stroke="rgba(0,0,0,0.3)" stroke-width="1.8"/>
  <!-- highlight -->
  <ellipse cx="72" cy="70" rx="14" ry="9" fill="rgba(255,255,255,0.2)" transform="rotate(-30,72,70)"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#27ae60" stroke-width="1" opacity="0.3"/>
</svg>