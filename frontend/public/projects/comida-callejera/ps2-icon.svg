<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <defs>
    <pattern id="sc" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="172" height="1" fill="rgba(0,0,0,0.08)"/>
    </pattern>
  </defs>
  <rect width="172" height="172" fill="#020a1c"/>
  
  <!-- taco shadow -->
  <ellipse cx="86" cy="146" rx="52" ry="7" fill="rgba(0,0,0,0.3)"/>
  <!-- taco shell back half (darker) -->
  <path d="M34,86 Q86,30 138,86 Q126,130 86,138 Q46,130 34,86 Z" fill="#b03a2e" opacity="0.65"/>
  <!-- lettuce (green) -->
  <path d="M42,86 Q50,70 64,72 Q70,62 80,68 Q86,58 92,68 Q102,62 108,72 Q122,70 130,86" fill="none" stroke="rgba(46,204,113,0.85)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tomato (red circles) -->
  <circle cx="65" cy="82" r="7" fill="rgba(220,50,50,0.8)"/>
  <circle cx="86" cy="74" r="7" fill="rgba(220,50,50,0.8)"/>
  <circle cx="107" cy="82" r="7" fill="rgba(220,50,50,0.8)"/>
  <!-- cheese (yellow layer) -->
  <path d="M48,90 Q86,76 124,90" fill="none" stroke="rgba(240,190,40,0.8)" stroke-width="5" stroke-linecap="round"/>
  <!-- meat layer -->
  <path d="M44,96 Q86,86 128,96" fill="none" stroke="rgba(120,60,20,0.75)" stroke-width="4" stroke-linecap="round"/>
  <!-- taco shell front -->
  <path d="M34,86 Q86,130 138,86 Q126,144 86,152 Q46,144 34,86 Z" fill="#e74c3c"/>
  <!-- shell texture -->
  <path d="M46,100 Q86,118 126,100" fill="none" stroke="#b03a2e" stroke-width="1.5" opacity="0.5"/>
  <path d="M52,112 Q86,126 120,112" fill="none" stroke="#b03a2e" stroke-width="1.2" opacity="0.4"/>
  <rect width="172" height="172" fill="url(#sc)" opacity="0.5"/>
  <rect x="1" y="1" width="170" height="170" fill="none" stroke="#e74c3c" stroke-width="1" opacity="0.3"/>
</svg>